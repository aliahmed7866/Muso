<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161a">
<meta name="muso-token" content="{{ token }}">
<title>Muso · Your music library</title>
<link rel="stylesheet" href="/static/style.css">
<script defer src="/static/app.js"></script>
</head>
<body>
<aside>
  <div class="brand"><span class="logo">≋</span>Muso</div>
  <nav aria-label="Music library">
    <button data-view="library" class="selected">♫ <span>Library</span></button>
    <button data-view="liked">♡ <span>Liked</span></button>
    <button data-view="discover">⌕ <span>Discover</span></button>
    <button data-view="imports">↓ <span>Imports</span></button>
  </nav>
  <div class="side-playlists"><h2>Playlists</h2><div id="playlists"></div></div>
  <button id="new-playlist" class="quiet">＋ New playlist</button>
</aside>
<main>
  <header><span id="status">● On this device</span><button id="add" class="primary">＋ Add music</button></header>
  <section class="hero"><div><p>YOUR MUSIC LIBRARY</p><h1 id="heading">Library</h1><div id="summary"></div></div><div class="record" aria-hidden="true"></div></section>
  <section id="body" aria-label="Current view"></section>
</main>
<footer>
  <button id="now" class="now" aria-label="Now playing and queue"><span class="cover" id="now-cover">♫</span><span><strong id="now-title">Nothing playing</strong><small id="now-artist">Your queue is empty</small></span></button>
  <div class="transport">
    <div class="controls">
      <button id="shuffle" title="Shuffle" aria-label="Shuffle" aria-pressed="false">⇄</button>
      <button id="prev" title="Previous" aria-label="Previous">⏮</button>
      <button id="play" class="primary play" aria-label="Play">▶</button>
      <button id="next" title="Next" aria-label="Next">⏭</button>
      <button id="repeat" title="Repeat off" aria-label="Repeat off">↻</button>
    </div>
    <div class="progress"><small id="elapsed">0:00</small><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position"><small id="duration">0:00</small></div>
  </div>
  <div class="extras"><button id="queue">Queue</button><button id="sleep">Sleep</button></div>
</footer>
<audio id="audio" preload="metadata"></audio>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="Close">✕</button></div><div id="dialog-body"></div></dialog>
<div id="toast" role="status" hidden></div>
</body>
</html>
