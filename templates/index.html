<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131518">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="muso-token" content="{{ token }}">
<title>Muso · Your music library</title>
<link rel="stylesheet" href="/static/style.css">
<script defer src="/static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#heading">Skip to music</a>
<aside>
  <div class="brand"><span class="logo" aria-hidden="true">≋</span>Muso<span class="brand-note">A little more you.</span></div>
  <nav aria-label="Music library">
    <button data-view="library" class="selected" data-icon="library"><span>Library</span></button>
    <button data-view="discover" data-icon="search"><span>Discover</span></button>
    <button data-view="playlists" data-icon="playlist"><span>Playlists</span></button>
    <button data-view="liked" data-icon="heart"><span>Liked songs</span></button>
    <button data-view="recap" data-icon="recap"><span>Recap</span></button>
    <button data-view="imports" data-icon="download"><span>Imports</span><span id="imports-badge" class="nav-badge" hidden></span></button>
  </nav>
  <div class="side-playlists"><h2>Playlists</h2><div id="playlists"></div></div>
  <button id="new-playlist" class="quiet">＋ New playlist</button>
</aside>
<main>
  <header><span id="status" role="status">Connecting to Muso…</span><div class="actions"><button id="refresh-library" aria-label="Refresh" title="Refresh library" data-icon="refresh" class="icon-only"></button><button id="install" aria-label="Install app" title="Install app" data-icon="install" class="icon-only"></button><button id="add" class="primary" data-icon="plus">Add music</button></div></header>
  <section class="hero"><div><p id="eyebrow">MADE OF YOUR FAVOURITES</p><h1 id="heading" tabindex="-1">Library</h1><div id="summary"></div></div><div class="record" aria-hidden="true"></div></section>
  <section id="body" aria-label="Current view"><div class="empty">Connecting to your music…</div></section>
</main>
<footer>
  <button id="now" class="now" aria-label="Open Now Playing"><span class="cover" id="now-cover">♫</span><span><strong id="now-title">Your next favourite awaits</strong><small id="now-artist">Choose a song to get started</small></span></button>
  <div class="transport">
    <div class="controls">
      <button id="shuffle" title="Shuffle" aria-label="Shuffle" aria-pressed="false">⇄</button>
      <button id="prev" title="Previous" aria-label="Previous">⏮</button>
      <button id="play" class="primary play" aria-label="Play">▶</button>
      <button id="next" title="Next" aria-label="Next">⏭</button>
      <button id="repeat" title="Repeat off" aria-label="Repeat off">↻</button>
    </div>
    <div class="progress"><small id="elapsed">0:00</small><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position"><small id="duration">0:00</small></div>
  </div>
  <div class="extras"><button id="queue">Queue</button><button id="sleep">Sleep</button></div>
</footer>
<audio id="audio" preload="metadata"></audio>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="Close" data-icon="close" class="icon-only"></button></div><div id="dialog-body"></div></dialog>
<div id="toast" role="status" hidden></div>
</body>
</html>
